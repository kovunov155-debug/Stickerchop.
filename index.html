<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sticker Shop — Telegram Mini App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        
        /* Виниловая обводка как у стикеров в Telegram */
        .tg-sticker {
            filter: drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 6px 10px rgba(0,0,0,0.4));
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            user-select: none;
            display: inline-block;
        }
        .tg-sticker:hover {
            transform: scale(1.15) rotate(2deg);
        }

        /* Анимации стикеров */
        @keyframes tg-float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-5px) rotate(2deg); } }
        @keyframes tg-wiggle { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
        @keyframes tg-bounce { 0%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px) scale(1.05); } }
        @keyframes tg-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

        .anim-float { animation: tg-float 2.8s ease-in-out infinite; }
        .anim-wiggle { animation: tg-wiggle 1.8s ease-in-out infinite; }
        .anim-bounce { animation: tg-bounce 2s cubic-bezier(0.28, 0.84, 0.42, 1) infinite; }
        .anim-pulse { animation: tg-pulse 2.2s ease-in-out infinite; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 9999px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-purple-500 selection:text-white font-sans antialiased">

    <!-- Шапка -->
    <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 p-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-purple-500 to-pink-500 flex items-center justify-center text-base shadow">✨</div>
            <div>
                <h1 class="text-base font-bold bg-gradient-to-r from-purple-400 via-pink-400 to-amber-300 bg-clip-text text-transparent leading-tight">Sticker Shop</h1>
                <p class="text-[11px] text-slate-400">56 анимированных стикеров Telegram</p>
            </div>
        </div>
        <button id="cart-btn" class="relative bg-slate-800/90 hover:bg-slate-700 border border-slate-700 px-3 py-2 rounded-xl text-sm font-medium transition flex items-center gap-1.5 shadow-md active:scale-95">
            🛒 <span id="cart-count" class="absolute -top-2 -right-2 bg-pink-500 text-white text-xs px-2 py-0.5 rounded-full font-bold shadow-md">0</span>
        </button>
    </header>

    <!-- Основной контент -->
    <main class="p-4 max-w-md mx-auto flex-1 w-full pb-24 space-y-4">
        <!-- Поиск -->
        <input id="search-input" type="text" placeholder="Поиск по 50+ стикерам..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-500 outline-none focus:border-purple-500">

        <!-- Фильтры категорий -->
        <div id="category-tabs" class="flex items-center gap-1.5 overflow-x-auto pb-1">
            <button onclick="filterCat('all')" class="cat-btn active px-3 py-1.5 rounded-xl text-xs font-semibold bg-purple-600 text-white whitespace-nowrap">Все (56)</button>
            <button onclick="filterCat('animals')" class="cat-btn px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap">🍊 Капибара & Сиба</button>
            <button onclick="filterCat('meme')" class="cat-btn px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap">🐸 Мемы & Пепе</button>
            <button onclick="filterCat('work')" class="cat-btn px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap">☕ Кофе & IT</button>
            <button onclick="filterCat('gaming')" class="cat-btn px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap">🕹️ 8-Бит</button>
            <button onclick="filterCat('cyber')" class="cat-btn px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap">⚡ Киберпанк</button>
            <button onclick="filterCat('anime')" class="cat-btn px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap">🌸 Аниме</button>
        </div>

        <div class="flex justify-between items-center">
            <h2 class="text-sm font-semibold text-slate-200 uppercase tracking-wide">Клавиатура стикеров</h2>
            <span class="text-xs text-amber-400 font-semibold bg-amber-400/10 px-2 py-0.5 rounded-md border border-amber-400/20">5 ⭐ / шт</span>
        </div>
        
        <!-- Сетка 50+ стикеров -->
        <div id="products-grid" class="grid grid-cols-3 gap-3">
            <!-- Генерируется скриптом -->
        </div>
    </main>

    <!-- Модальное окно корзины -->
    <div id="cart-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-900 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 border border-slate-800 shadow-2xl max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
                <div class="flex items-center gap-2">
                    <span class="text-lg">🛍️</span>
                    <h3 class="font-bold text-base text-white">Корзина стикеров</h3>
                </div>
                <button id="close-cart" class="text-slate-400 hover:text-white text-2xl w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center leading-none">&times;</button>
            </div>
            
            <div id="cart-items" class="flex-1 overflow-y-auto space-y-2.5 mb-4 pr-1"></div>

            <div class="border-t border-slate-800 pt-3 mt-auto">
                <div class="flex justify-between items-center mb-3 text-sm font-semibold">
                    <span class="text-slate-300">Итого:</span>
                    <span id="cart-total" class="text-amber-300 font-bold text-base">0 ⭐</span>
                </div>
                <button id="checkout-btn" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-95 py-3.5 rounded-xl font-bold text-white transition shadow-lg shadow-pink-600/20 active:scale-[0.98]">
                    Оплатить заказ
                </button>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        let tg = (typeof window !== 'undefined' && window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
        if (tg) {
            try { tg.ready(); tg.expand(); } catch (e) {}
        }

        function triggerHaptic(style = 'light') {
            if (tg && tg.HapticFeedback) {
                try { tg.HapticFeedback.impactOccurred(style); } catch (e) {}
            }
        }

        // Коллекция из 56 анимированных стикеров
        const stickers = [
            // Капибара & Сиба (animals)
            { id: 1, name: 'Апельсин Дзен', cat: 'animals', emoji: '🍊', anim: 'anim-wiggle', price: 5 },
            { id: 2, name: 'Горячий Источник', cat: 'animals', emoji: '🛁', anim: 'anim-float', price: 5 },
            { id: 3, name: 'Полный Релакс', cat: 'animals', emoji: '😌', anim: 'anim-pulse', price: 5 },
            { id: 4, name: 'Арбузный Кайф', cat: 'animals', emoji: '🍉', anim: 'anim-bounce', price: 5 },
            { id: 5, name: 'Друг Черепаха', cat: 'animals', emoji: '🐢', anim: 'anim-float', price: 5 },
            { id: 6, name: 'СПА-День', cat: 'animals', emoji: '💆‍♂️', anim: 'anim-pulse', price: 5 },
            { id: 7, name: 'Сиба на Стиле', cat: 'animals', emoji: '🐕', anim: 'anim-wiggle', price: 5 },
            { id: 8, name: 'Токийский Бит', cat: 'animals', emoji: '🎧', anim: 'anim-bounce', price: 5 },
            { id: 9, name: 'Уличный Огонь', cat: 'animals', emoji: '🔥', anim: 'anim-bounce', price: 5 },
            { id: 10, name: 'На Все 100', cat: 'animals', emoji: '💯', anim: 'anim-pulse', price: 5 },

            // Мемы & Крипта (meme)
            { id: 11, name: 'To The Moon', cat: 'meme', emoji: '🚀', anim: 'anim-bounce', price: 5 },
            { id: 12, name: 'Алмазные Руки', cat: 'meme', emoji: '💎', anim: 'anim-pulse', price: 5 },
            { id: 13, name: 'Фиксация Прибыли', cat: 'meme', emoji: '🤑', anim: 'anim-wiggle', price: 5 },
            { id: 14, name: 'Листинг Биржи', cat: 'meme', emoji: '🍾', anim: 'anim-float', price: 5 },
            { id: 15, name: 'Рекет Свечи', cat: 'meme', emoji: '😭', anim: 'anim-wiggle', price: 5 },
            { id: 16, name: 'Крипто Пепе', cat: 'meme', emoji: '🐸', anim: 'anim-bounce', price: 5 },
            { id: 17, name: 'Запасаюсь Попкорном', cat: 'meme', emoji: '🍿', anim: 'anim-wiggle', price: 5 },
            { id: 18, name: 'Умер от Смеха', cat: 'meme', emoji: '💀', anim: 'anim-bounce', price: 5 },

            // Кофеман & IT (work)
            { id: 19, name: '4-й Эспрессо', cat: 'work', emoji: '☕', anim: 'anim-wiggle', price: 5 },
            { id: 20, name: 'Релиз Горит!', cat: 'work', emoji: '🔥', anim: 'anim-bounce', price: 5 },
            { id: 21, name: 'Яростный Дебаг', cat: 'work', emoji: '💻', anim: 'anim-pulse', price: 5 },
            { id: 22, name: 'Утренний Дейли', cat: 'work', emoji: '🧟‍♂️', anim: 'anim-float', price: 5 },
            { id: 23, name: 'Фича, Не Баг', cat: 'work', emoji: '🐛', anim: 'anim-bounce', price: 5 },
            { id: 24, name: 'Растаял в Пятницу', cat: 'work', emoji: '🫠', anim: 'anim-pulse', price: 5 },
            { id: 25, name: 'Не Беспокоить', cat: 'work', emoji: '📴', anim: 'anim-float', price: 5 },
            { id: 26, name: 'Джира Полная', cat: 'work', emoji: '📊', anim: 'anim-pulse', price: 5 },

            // 8-Бит Гейминг (gaming)
            { id: 27, name: 'GG WP', cat: 'gaming', emoji: '🕹️', anim: 'anim-wiggle', price: 5 },
            { id: 28, name: 'Космический Босс', cat: 'gaming', emoji: '👾', anim: 'anim-float', price: 5 },
            { id: 29, name: '1UP Экстра Жизнь', cat: 'gaming', emoji: '💖', anim: 'anim-pulse', price: 5 },
            { id: 30, name: 'Game Over', cat: 'gaming', emoji: '💀', anim: 'anim-wiggle', price: 5 },
            { id: 31, name: 'Гриб Роста', cat: 'gaming', emoji: '🍄', anim: 'anim-bounce', price: 5 },
            { id: 32, name: 'Супер-Звезда', cat: 'gaming', emoji: '⭐', anim: 'anim-pulse', price: 5 },
            { id: 33, name: 'Кубок Победы', cat: 'gaming', emoji: '🏆', anim: 'anim-bounce', price: 5 },
            { id: 34, name: 'Бомбермен Взрыв', cat: 'gaming', emoji: '💣', anim: 'anim-wiggle', price: 5 },

            // Киберпанк & Самурай (cyber)
            { id: 35, name: 'Кибер-Кот Оскал', cat: 'cyber', emoji: '😼', anim: 'anim-wiggle', price: 5 },
            { id: 36, name: 'Удар Катаной', cat: 'cyber', emoji: '🗡️', anim: 'anim-bounce', price: 5 },
            { id: 37, name: 'Маска Они', cat: 'cyber', emoji: '👺', anim: 'anim-pulse', price: 5 },
            { id: 38, name: 'Неоновый Фонарь', cat: 'cyber', emoji: '🏮', anim: 'anim-float', price: 5 },
            { id: 39, name: 'Неоновый Дракон', cat: 'cyber', emoji: '🐉', anim: 'anim-bounce', price: 5 },
            { id: 40, name: 'Очки Киберпанк', cat: 'cyber', emoji: '🕶️', anim: 'anim-float', price: 5 },
            { id: 41, name: 'AI Робот', cat: 'cyber', emoji: '🤖', anim: 'anim-wiggle', price: 5 },
            { id: 42, name: 'Разряд Молнии', cat: 'cyber', emoji: '⚡', anim: 'anim-pulse', price: 5 },

            // Аниме & Чиби (anime)
            { id: 43, name: 'Звезды в Глазах', cat: 'anime', emoji: '✨', anim: 'anim-float', price: 5 },
            { id: 44, name: 'Пожалуйста~', cat: 'anime', emoji: '🥺', anim: 'anim-wiggle', price: 5 },
            { id: 45, name: 'Сердечко Пальцами', cat: 'anime', emoji: '💖', anim: 'anim-pulse', price: 5 },
            { id: 46, name: 'Цундере Дуется', cat: 'anime', emoji: '😤', anim: 'anim-wiggle', price: 5 },
            { id: 47, name: 'Цветение Сакуры', cat: 'anime', emoji: '🌸', anim: 'anim-float', price: 5 },
            { id: 48, name: 'Няяя Котик', cat: 'anime', emoji: '🐱', anim: 'anim-bounce', price: 5 },
            { id: 49, name: 'Магический Единорог', cat: 'anime', emoji: '🦄', anim: 'anim-float', price: 5 },
            { id: 50, name: 'Праздник Пати', cat: 'anime', emoji: '🥳', anim: 'anim-bounce', price: 5 },

            // Дополнительные топ-стикеры
            { id: 51, name: 'Утка на Стиле', cat: 'animals', emoji: '🦆', anim: 'anim-wiggle', price: 5 },
            { id: 52, name: 'Утка Босс', cat: 'animals', emoji: '😎', anim: 'anim-float', price: 5 },
            { id: 53, name: 'Космо-Хомяк', cat: 'animals', emoji: '👨‍🚀', anim: 'anim-float', price: 5 },
            { id: 54, name: 'Кольца Сатурна', cat: 'animals', emoji: '🪐', anim: 'anim-pulse', price: 5 },
            { id: 55, name: 'Корона Чемпиона', cat: 'meme', emoji: '👑', anim: 'anim-bounce', price: 5 },
            { id: 56, name: 'Встретил НЛО', cat: 'animals', emoji: '🛸', anim: 'anim-float', price: 5 }
        ];

        let cart = [];
        let currentCat = 'all';

        function renderStickers(items = stickers) {
            const grid = document.getElementById('products-grid');
            if (!grid) return;
            grid.innerHTML = '';
            items.forEach(st => {
                grid.innerHTML += `
                    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-2.5 flex flex-col items-center justify-between shadow-md hover:border-purple-500/50 transition active:scale-95 cursor-pointer">
                        <div class="py-2 flex items-center justify-center">
                            <span class="text-5xl tg-sticker ${st.anim}">${st.emoji}</span>
                        </div>
                        <div class="w-full text-center mt-1">
                            <h3 class="font-bold text-[11px] text-slate-100 truncate">${st.name}</h3>
                        </div>
                        <div class="w-full flex justify-between items-center mt-2 pt-1.5 border-t border-slate-800/80">
                            <span class="text-amber-400 font-bold text-xs">${st.price} ⭐</span>
                            <button onclick="addToCart(${st.id})" class="bg-purple-600 hover:bg-purple-500 text-white w-6 h-6 rounded-lg text-xs font-bold flex items-center justify-center shadow transition active:scale-90">+</button>
                        </div>
                    </div>
                `;
            });
        }

        window.filterCat = function(cat) {
            currentCat = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = 'cat-btn px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 text-slate-400 border border-slate-800 whitespace-nowrap';
            });
            event.target.className = 'cat-btn active px-3 py-1.5 rounded-xl text-xs font-semibold bg-purple-600 text-white whitespace-nowrap';
            triggerHaptic('light');
            applyFilters();
        };

        function applyFilters() {
            const q = document.getElementById('search-input').value.toLowerCase().trim();
            const filtered = stickers.filter(s => {
                const matchCat = (currentCat === 'all' || s.cat === currentCat);
                const matchQ = (!q || s.name.toLowerCase().includes(q) || s.emoji.includes(q));
                return matchCat && matchQ;
            });
            renderStickers(filtered);
        }

        window.addToCart = function(id) {
            const prod = stickers.find(p => p.id === id);
            if (!prod) return;
            const item = cart.find(i => i.id === id);
            if (item) item.quantity++;
            else cart.push({ ...prod, quantity: 1 });
            updateCart();
            triggerHaptic('medium');
        };

        window.changeQty = function(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            item.quantity += delta;
            if (item.quantity <= 0) cart = cart.filter(i => i.id !== id);
            updateCart();
            triggerHaptic('light');
        };

        function updateCart() {
            const count = cart.reduce((s, i) => s + i.quantity, 0);
            document.getElementById('cart-count').innerText = count;
            const cont = document.getElementById('cart-items');
            cont.innerHTML = cart.length === 0 ? '<p class="text-center text-xs text-slate-400 py-8">Корзина пуста</p>' : '';
            cart.forEach(i => {
                cont.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/60">
                        <div class="flex items-center gap-2">
                            <span class="text-2xl tg-sticker">${i.emoji}</span>
                            <div>
                                <h4 class="text-xs font-medium text-white">${i.name}</h4>
                                <p class="text-[11px] text-amber-400 font-semibold">${i.price} ⭐</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-1 bg-slate-900 border border-slate-800 rounded-lg p-0.5">
                            <button onclick="changeQty(${i.id}, -1)" class="w-6 h-6 text-slate-300 text-xs font-bold active:scale-95">−</button>
                            <span class="text-xs font-mono font-bold px-1">${i.quantity}</span>
                            <button onclick="changeQty(${i.id}, 1)" class="w-6 h-6 text-slate-300 text-xs font-bold active:scale-95">+</button>
                        </div>
                    </div>
                `;
            });
            const total = cart.reduce((s, i) => s + i.price * i.quantity, 0);
            document.getElementById('cart-total').innerText = `${total} ⭐`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderStickers();
            const modal = document.getElementById('cart-modal');
            document.getElementById('cart-btn').addEventListener('click', () => { triggerHaptic('light'); modal.classList.remove('hidden'); });
            document.getElementById('close-cart').addEventListener('click', () => modal.classList.add('hidden'));
            document.getElementById('search-input').addEventListener('input', applyFilters);
            document.getElementById('checkout-btn').addEventListener('click', () => {
                if (cart.length === 0) return alert('Добавьте стикеры в корзину');
                triggerHaptic('heavy');
                if (tg && typeof tg.sendData === 'function') {
                    try { tg.sendData(JSON.stringify(cart)); } catch (e) {}
                }
                alert('Стикеры успешно оформлены!');
                cart = [];
                updateCart();
                modal.classList.add('hidden');
            });
        });
    </script>
</body>
</html>
