<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto Card Shop - Telegram Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 9999px; }
        
        .holo-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .holo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(168, 85, 247, 0.2);
        }
        .holo-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                0deg,
                transparent 0%,
                rgba(236, 72, 153, 0.03) 30%,
                rgba(168, 85, 247, 0.08) 50%,
                rgba(59, 130, 246, 0.03) 70%,
                transparent 100%
            );
            transform: rotate(30deg);
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-purple-500 selection:text-white font-sans antialiased">

    <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 p-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-500 via-pink-500 to-amber-400 flex items-center justify-center text-lg shadow-lg shadow-purple-500/30">✨</div>
            <div>
                <h1 class="text-base font-bold bg-gradient-to-r from-purple-400 via-pink-400 to-amber-300 bg-clip-text text-transparent leading-tight">CRYPTO CARDS</h1>
                <p class="text-[11px] text-slate-400">Коллекционные стикеры</p>
            </div>
        </div>
        <button id="cart-btn" class="relative bg-slate-900/90 hover:bg-slate-700 border border-slate-700/80 px-3.5 py-2.5 rounded-xl text-sm font-medium transition flex items-center gap-1.5 focus:outline-none focus:ring-1 focus:ring-purple-500 shadow-inner">
            <span class="text-lg">🛒</span>
            <span id="cart-count" class="absolute -top-2 -right-2 bg-gradient-to-r from-pink-500 to-purple-600 text-white text-xs px-2 py-0.5 rounded-full font-bold shadow-md">0</span>
        </button>
    </header>

    <main class="p-4 max-w-md mx-auto flex-1 w-full pb-20 space-y-4">
        <div class="relative">
            <input id="search-input" type="text" placeholder="Поиск редких стикеров..." class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3.5 pl-11 text-sm text-slate-100 placeholder-slate-500 outline-none focus:border-purple-500 transition shadow-sm">
            <span class="absolute left-4 top-4 text-slate-500">🔍</span>
        </div>

        <div class="flex justify-between items-center px-1">
            <h2 class="text-sm font-semibold text-slate-200 uppercase tracking-wide">Каталог коллекции</h2>
            <span class="text-xs text-amber-400 font-semibold bg-amber-400/10 px-2.5 py-1 rounded-md border border-amber-400/20">⭐ 40 - 80 Stars</span>
        </div>

        <div id="products-grid" class="grid grid-cols-2 gap-4"></div>
    </main>

    <div id="cart-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-end sm:items-center justify-center">
        <div class="bg-slate-900 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 border-t sm:border border-slate-800 shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
                <div class="flex items-center gap-2">
                    <span class="text-lg">🛒</span>
                    <h3 class="font-bold text-base text-white">Корзина</h3>
                </div>
                <button id="close-cart" class="text-slate-400 hover:text-white transition focus:outline-none text-lg">✕</button>
            </div>
            
            <div id="cart-items" class="flex-1 overflow-y-auto space-y-3 mb-4 pr-1"></div>
            
            <div class="border-t border-slate-800 pt-4 mt-auto">
                <div class="flex justify-between items-center mb-4 text-sm font-semibold">
                    <span class="text-slate-300">Итого:</span>
                    <span id="cart-total" class="text-amber-300 font-bold text-base">0 ⭐</span>
                </div>
                <button id="checkout-btn" class="w-full bg-gradient-to-r from-purple-600 via-pink-600 to-amber-500 hover:opacity-95 py-3.5 rounded-xl font-semibold shadow-lg shadow-purple-900/30 transition focus:outline-none focus:ring-2 focus:ring-purple-500">
                    Оплатить заказ
                </button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp;
        try { tg.ready(); tg.expand(); } catch (e) {}

        function triggerHaptic(style = 'light') { 
            if (tg && tg.HapticFeedback) { 
                try { tg.HapticFeedback.impactOccurred(style); } catch (e) {} 
            } 
        }

        const products = [
            
            { id: 1, name: 'Cyber Cat', ru: 'Кибер-Кот', price: 50, img: 'https://i.ibb.co/3m20f8L/cyber-cat.webp', rarity: 'HOLO RARE' },
            { id: 2, name: 'Crypto Pepe', ru: 'Крипто Пепе', price: 55, img: 'https://i.ibb.co/6y458kR/crypto-pepe.webp', rarity: 'ULTRA RARE' },
            { id: 3, name: 'Zen Capybara', ru: 'Капибара Дзен', price: 45, img: 'https://i.ibb.co/b1J9L7F/zen-capybara.webp', rarity: 'RARE' },
            { id: 4, name: 'Cyber Samurai', ru: 'Кибер Самурай', price: 70, img: 'https://i.ibb.co/dK5V2p1/cyber-samurai.webp', rarity: 'SECRET' },
            { id: 5, name: 'Neon Shiba', ru: 'Неоновый Сиба', price: 60, img: 'https://i.ibb.co/Z6PZk5x/neon-shiba.webp', rarity: 'HOLO RARE' },
            { id: 6, name: 'Retro Arcade', ru: 'Ретро Геймер', price: 45, img: 'https://i.ibb.co/X8YkF7R/retro-arcade.webp', rarity: 'RARE' },
            { id: 7, name: 'Pixel Duck', ru: 'Пиксельная Утка', price: 40, img: 'https://i.ibb.co/Fk1Q7R9/pixel-duck.webp', rarity: 'COMMON' },
            { id: 8, name: 'Anime Girl', ru: 'Аниме Девочка', price: 65, img: 'https://i.ibb.co/Pj0Q7R9/anime-girl.webp', rarity: 'ULTRA RARE' },
            { id: 9, name: 'Space Dog', ru: 'Космо-Пес', price: 50, img: 'https://i.ibb.co/R8R8R8R/space-dog.webp', rarity: 'HOLO RARE' },
            { id: 10, name: 'Quantum Fox', ru: 'Квантовый Лис', price: 75, img: 'https://i.ibb.co/T9T9T9T/quantum-fox.webp', rarity: 'SECRET' },
            { id: 11, name: 'Laser Dragon', ru: 'Лазерный Дракон', price: 80, img: 'https://i.ibb.co/S1S1S1S/laser-dragon.webp', rarity: 'SECRET' },
            { id: 12, name: 'Matrix Hacker', ru: 'Матричный Хакер', price: 65, img: 'https://i.ibb.co/W2W2W2W/matrix-hacker.webp', rarity: 'ULTRA RARE' },
            { id: 13, name: 'Electro Panda', ru: 'Электро Панда', price: 55, img: 'https://i.ibb.co/V3V3V3V/electro-panda.webp', rarity: 'HOLO RARE' },
            { id: 14, name: 'Mecha Phoenix', ru: 'Меха Феникs', price: 80, img: 'https://i.ibb.co/B4B4B4B/mecha-phoenix.webp', rarity: 'SECRET' },
            { id: 15, name: 'Street Punk', ru: 'Стрит Панк', price: 50, img: 'https://i.ibb.co/N5N5N5N/street-punk.webp', rarity: 'RARE' },
            { id: 16, name: 'Android Glitch', ru: 'Андроид Глитч', price: 55, img: 'https://i.ibb.co/M6M6M6M/android-glitch.webp', rarity: 'HOLO RARE' },
            { id: 17, name: 'Dark Wizard', ru: 'Тёмный Маг', price: 70, img: 'https://i.ibb.co/C7C7C7C/dark-wizard.webp', rarity: 'ULTRA RARE' },
            { id: 18, name: 'Holobot V1', ru: 'Голобот V1', price: 45, img: 'https://i.ibb.co/X3X3X3X/holobot.webp', rarity: 'RARE' },
            { id: 19, name: 'Neon Skull', ru: 'Неоновый Череп', price: 60, img: 'https://i.ibb.co/Z2Z2Z2Z/neon-skull.webp', rarity: 'ULTRA RARE' },
            { id: 20, name: 'Cyber Coffee', ru: 'Кибер Кофе', price: 40, img: 'https://i.ibb.co/Y1Y1Y1Y/cyber-coffee.webp', rarity: 'COMMON' }
        ];

        let cart = [];

        function renderProducts(items = products) {
            const grid = document.getElementById('products-grid');
            if (!grid) return;
            grid.innerHTML = '';
            
            items.forEach(p => {
                let rarityColor = 'text-blue-400 border-blue-500/30 bg-blue-500/10';
                if (p.rarity === 'HOLO RARE') rarityColor = 'text-purple-400 border-purple-500/30 bg-purple-500/10';
                if (p.rarity === 'ULTRA RARE') rarityColor = 'text-pink-400 border-pink-500/30 bg-pink-500/10';
                if (p.rarity === 'SECRET') rarityColor = 'text-amber-400 border-amber-500/30 bg-amber-500/10';

                grid.innerHTML += `
                    <div class="holo-card border border-slate-800/80 rounded-2xl overflow-hidden shadow-md group border-t border-t-slate-700/50">
                        <div class="absolute top-2.5 right-2.5 z-10 text-[9px] font-bold px-2 py-0.5 rounded-full border ${rarityColor} backdrop-blur-md">
                            ${p.rarity}
                        </div>
                        <div class="w-full h-40 overflow-hidden bg-slate-900 relative">
                            <img src="${p.img}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500" loading="lazy">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent opacity-60"></div>
                        </div>
                        <div class="p-4 flex flex-col flex-1 bg-slate-900/40 backdrop-blur-sm">
                            <h3 class="font-bold text-sm text-white truncate">${p.name}</h3>
                            <p class="text-[11px] text-slate-400 truncate mb-3">${p.ru}</p>
                            <div class="flex justify-between items-center mt-auto pt-3 border-t border-slate-800/80">
                                <span class="text-amber-400 font-extrabold text-sm">⭐ ${p.price}</span>
                                <button onclick="addToCart(${p.id})" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 rounded-xl px-4 py-2 text-[11px] font-bold text-white transition shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                                    В корзину
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function addToCart(id) {
            triggerHaptic('light');
            const prod = products.find(p => p.id === id);
            if (!prod) return;
            
            const item = cart.find(i => i.id === id);
            if (item) {
                item.quantity++;
            } else {
                cart.push({ ...prod, quantity: 1 });
            }
            updateCart();
            triggerHaptic('medium');
        }

        function changeQty(id, delta) {
            triggerHaptic('light');
            const item = cart.find(i => i.id === id);
            if (!item) return;
            
            item.quantity += delta;
            if (item.quantity <= 0) {
                cart = cart.filter(i => i.id !== id);
            }
            updateCart();
        }

        function updateCart() {
            const count = cart.reduce((s, i) => s + i.quantity, 0);
            document.getElementById('cart-count').innerText = count;
            
            const cont = document.getElementById('cart-items');
            cont.innerHTML = cart.length === 0 ? '<p class="text-center text-slate-500 text-sm py-8">Ваша коллекция пуста 🛒</p>' : '';
            
            cart.forEach(i => {
                cont.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-lg bg-slate-800 overflow-hidden shadow-inner">
                                <img src="${i.img}" alt="${i.name}" class="w-full h-full object-cover">
                            </div>
                            <div>
                                <h4 class="text-xs font-bold text-white truncate max-w-[120px]">${i.name}</h4>
                                <p class="text-[11px] text-amber-400 font-semibold mt-0.5">⭐ ${i.price} × ${i.quantity}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2.5">
                            <button onclick="changeQty(${i.id}, -1)" class="w-8 h-8 rounded-lg bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center font-bold transition">-</button>
                            <span class="text-xs font-bold w-6 text-center">${i.quantity}</span>
                            <button onclick="changeQty(${i.id}, 1)" class="w-8 h-8 rounded-lg bg-purple-600 text-white flex items-center justify-center font-bold transition">+</button>
                        </div>
                    </div>
                `;
            });

            const total = cart.reduce((s, i) => s + (i.price * i.quantity), 0);
            document.getElementById('cart-total').innerText = `${total} ⭐`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            
            const modal = document.getElementById('cart-modal');
            document.getElementById('cart-btn').addEventListener('click', () => { 
                triggerHaptic('light'); 
                modal.classList.remove('hidden'); 
            });
            document.getElementById('close-cart').addEventListener('click', () => { 
                triggerHaptic('light'); 
                modal.classList.add('hidden'); 
            });

            document.getElementById('search-input').addEventListener('input', (e) => {
                const q = e.target.value.toLowerCase();
                const filtered = products.filter(p => p.name.toLowerCase().includes(q) || p.ru.toLowerCase().includes(q) || p.rarity.toLowerCase().includes(q));
                renderProducts(filtered);
            });

            document.getElementById('checkout-btn').addEventListener('click', () => {
                triggerHaptic('heavy');
                if (cart.length === 0) return alert('Добавьте карточки в корзину');
                
                const cont = document.getElementById('cart-items');
                cont.innerHTML = `
                    <div class="bg-slate-950/60 p-5 rounded-2xl border border-slate-800 text-center space-y-4">
                        <div class="w-16 h-16 bg-green-500/10 text-green-500 rounded-full flex items-center justify-center mx-auto text-3xl">✓</div>
                        <div>
                            <h3 class="font-bold text-lg text-white mb-1">Заказ успешно оформлен!</h3>
                            <p class="text-xs text-slate-400">Скопируйте адрес кошелька для совершения перевода:</p>
                        </div>
                        <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 text-amber-300 font-mono text-sm break-all shadow-inner select-all">
                            UQAiEqXWyX1j-cgeyksUGvZC5T2Fk2YkV1mxCEDH08wuafd
                        </div>
                        <button onclick="document.getElementById('cart-modal').classList.add('hidden')" class="w-full bg-slate-800 hover:bg-slate-700 py-3 rounded-xl text-sm font-semibold transition">Закрыть</button>
                    </div>
                `;
                
                document.querySelector('.border-t.border-slate-800.pt-4.mt-auto').classList.add('hidden');
                
                cart = [];
                updateCart();
                triggerHaptic('success');
            });
        });
    </script>
</body>
</html>
