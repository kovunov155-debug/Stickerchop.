<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sticker Shop - Telegram Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 9999px; }
        
        .holo-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .holo-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(168, 85, 247, 0.2);
        }
        .holo-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                0deg,
                transparent 0%,
                rgba(236, 72, 153, 0.04) 30%,
                rgba(168, 85, 247, 0.1) 50%,
                rgba(59, 130, 246, 0.04) 70%,
                transparent 100%
            );
            transform: rotate(30deg);
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-purple-500 selection:text-white font-sans antialiased">

    <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 p-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-purple-500 via-pink-500 to-amber-400 flex items-center justify-center text-base shadow-lg shadow-purple-500/30">✨</div>
            <div>
                <h1 class="text-base font-bold bg-gradient-to-r from-purple-400 via-pink-400 to-amber-300 bg-clip-text text-transparent leading-tight">CYBER STICKERS</h1>
                <p class="text-[11px] text-slate-400">>10 паков • 160+ стикеров Telegram</p>
            </div>
        </div>
        <button id="cart-btn" class="relative bg-slate-900/90 hover:bg-slate-800 border border-slate-700/80 px-3.5 py-2 rounded-xl text-sm font-medium transition flex items-center gap-1.5 focus:outline-none focus:ring-1 focus:ring-purple-500 shadow-inner">
            <span class="text-xl">🛒</span>
            <span id="cart-count" class="absolute -top-2 -right-2 bg-gradient-to-r from-pink-500 to-purple-600 text-white text-xs px-2 py-0.5 rounded-full font-bold shadow-md">0</span>
        </button>
    </header>

    <main class="p-4 max-w-md mx-auto flex-1 w-full pb-20 space-y-4">
        <div class="relative">
            <input id="search-input" type="text" placeholder="Найдите стикерпаки..." class="w-full bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-3 pl-11 text-sm text-slate-100 placeholder-slate-500 outline-none focus:border-purple-500 transition shadow-sm">
            <span class="absolute left-4 top-3.5 text-slate-500">🔍</span>
        </div>

        <div class="flex justify-between items-center px-1">
            <h2 class="text-sm font-semibold text-slate-200 uppercase tracking-wide">КАТАЛОГ СТИКЕРОВ</h2>
            <span class="text-xs text-amber-400 font-semibold bg-amber-400/10 px-2.5 py-1 rounded-md border border-amber-400/20">40-60 ⭐</span>
        </div>

        <div id="products-grid" class="grid grid-cols-2 gap-3.5"></div>
    </main>

    <div id="cart-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-end sm:items-center justify-center">
        <div class="bg-slate-900 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 border-t sm:border border-slate-800 shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
                <div class="flex items-center gap-2">
                    <span class="text-lg">🛒</span>
                    <h3 class="font-bold text-base text-white">Корзина стикеров</h3>
                </div>
                <button id="close-cart" class="text-slate-400 hover:text-white transition focus:outline-none text-lg">✕</button>
            </div>
            
            <div id="cart-items" class="flex-1 overflow-y-auto space-y-2.5 mb-4 pr-1"></div>
            
            <div class="border-t border-slate-800 pt-3 mt-auto">
                <div class="flex justify-between items-center mb-3 text-sm font-semibold">
                    <span class="text-slate-300">Итого:</span>
                    <span id="cart-total" class="text-amber-300 font-bold text-base">0 ⭐</span>
                </div>
                <button id="checkout-btn" class="w-full bg-gradient-to-r from-purple-600 via-pink-600 to-amber-500 hover:opacity-95 py-3.5 rounded-xl font-semibold shadow-lg shadow-purple-900/30 transition focus:outline-none focus:ring-2 focus:ring-purple-500">
                    Оплатить заказ
                </button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp;
        try { tg.ready(); tg.expand(); } catch (e) {}

        function triggerHaptic(style = 'light') { 
            if (tg && tg.HapticFeedback) { 
                try { tg.HapticFeedback.impactOccurred(style); } catch (e) {} 
            } 
        }

        const products = [
            { id: 1, name: 'Neon Shiba', ru: 'Неоновый Сиба Доге', price: 55, img: 'https://images.unsplash.com/photo-1583337130417-3346a1be7de9?w=500&q=80', count: '30 стикеров' },
            { id: 2, name: 'Space Hamster', ru: 'Космо-Хомяк Гагарин', price: 45, img: 'https://images.unsplash.com/photo-1534067783941-51c9c037cdfa?w=500&q=80', count: '26 стикеров' },
            { id: 3, name: 'Cyber Cat Pack', ru: 'Кибер-Кот 2077', price: 50, img: 'https://images.unsplash.com/photo-1543852786-cfcf660bcfe2?w=500&q=80', count: '24 стикера' },
            { id: 4, name: 'Crypto Pepe', ru: 'Крипто Пепе Дебен', price: 50, img: 'https://images.unsplash.com/photo-1514888286974-6c03e2c1dba9?w=500&q=80', count: '20 стикеров' },
            { id: 5, name: 'Capybar Zen', ru: 'Капибара Дзен', price: 45, img: 'https://images.unsplash.com/photo-1574158692287-d140e3ad800e?w=500&q=80', count: '18 стикеров' },
            { id: 6, name: 'Coffee & Deadline', ru: 'Кофеман & Дедлайн', price: 40, img: 'https://images.unsplash.com/photo-1559056199-641a0ac8b55e?w=500&q=80', count: '22 стикера' },
            { id: 7, name: 'Retro Arcade 8-Bit', ru: 'Ретро Геймер', price: 45, img: 'https://images.unsplash.com/photo-1579737920364-75af72d4c062?w=500&q=80', count: '25 стикеров' },
            { id: 8, name: 'Cyber Samurai', ru: 'Кибер Самурай', price: 60, img: 'https://images.unsplash.com/photo-1511895426328-dc8019482fe0?w=500&q=80', count: '32 стикера' },
            { id: 9, name: 'Anime Vibes', ru: 'Аниме & Чиби', price: 60, img: 'https://images.unsplash.com/photo-1614036417643-524dc620ae41?w=500&q=80', count: '28 стикеров' },
            { id: 10, name: 'Pixel Ducks', ru: 'Пиксельные Утки', price: 40, img: 'https://images.unsplash.com/photo-1517423531524-8b5443c0805c?w=500&q=80', count: '20 стикеров' },
            { id: 11, name: 'Quantum Fox', ru: 'Квантовый Лис', price: 65, img: 'https://images.unsplash.com/photo-1589883661923-6476cb0ae0f2?w=500&q=80', count: '24 стикера' },
            { id: 12, name: 'Laser Dragon', ru: 'Лазерный Дракон', price: 70, img: 'https://images.unsplash.com/photo-1606014389599-4c6e93bc3f15?w=500&q=80', count: '30 стикеров' },
            { id: 13, name: 'Matrix Hacker', ru: 'Матричный Хакер', price: 55, img: 'https://images.unsplash.com/photo-1536376034266-993d0f0d2c0b?w=500&q=80', count: '25 стикеров' },
            { id: 14, name: 'Electro Panda', ru: 'Электро Панда', price: 50, img: 'https://images.unsplash.com/photo-1564767258385-2e6b7cbf2e0d?w=500&q=80', count: '22 стикера' },
            { id: 15, name: 'Mecha Phoenix', ru: 'Меха Феникс', price: 75, img: 'https://images.unsplash.com/photo-1541532742994-550ff4a974cc?w=500&q=80', count: '35 стикеров' },
            { id: 16, name: 'Street Punk', ru: 'Стрит Панк', price: 45, img: 'https://images.unsplash.com/photo-1627969348984-7ac68f03ec5e?w=500&q=80', count: '20 стикеров' },
            { id: 17, name: 'Android Glitch', ru: 'Андроид Глитч', price: 50, img: 'https://images.unsplash.com/photo-1639322537231-2303c73b0e0f?w=500&q=80', count: '24 стикера' },
            { id: 18, name: 'Dark Wizard', ru: 'Тёмный Маг 2077', price: 65, img: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500&q=80', count: '28 стикеров' },
            { id: 19, name: 'Holobot V1', ru: 'Голобот V1', price: 45, img: 'https://images.unsplash.com/photo-1535378629571-e5d436cf00f6?w=500&q=80', count: '20 стикеров' },
            { id: 20, name: 'Neon Skull', ru: 'Неоновый Череп', price: 55, img: 'https://images.unsplash.com/photo-1599839352936-39ee690cd4ec?w=500&q=80', count: '26 стикеров' }
        ];

        let cart = [];

        function renderProducts(items = products) {
            const grid = document.getElementById('products-grid');
            if (!grid) return;
            grid.innerHTML = '';
            
            items.forEach(p => {
                grid.innerHTML += `
                    <div class="holo-card border border-slate-800/80 rounded-2xl overflow-hidden shadow-md flex flex-col group">
                        <div class="relative w-full h-36 bg-slate-900 overflow-hidden">
                            <img src="${p.img}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
                            <span class="absolute top-2 left-2 bg-black/60 backdrop-blur-md text-[10px] text-slate-200 px-2 py-0.5 rounded-full font-medium">
                                ${p.count}
                            </span>
                        </div>
                        <div class="p-3.5 flex flex-col flex-1 bg-slate-900/60 backdrop-blur-sm">
                            <h3 class="font-bold text-xs text-white truncate">${p.name}</h3>
                            <p class="text-[11px] text-slate-400 truncate mb-2.5">${p.ru}</p>
                            <div class="flex justify-between items-center mt-auto pt-2 border-t border-slate-800/80">
                                <span class="text-amber-400 font-extrabold text-xs">⭐ ${p.price}</span>
                                <button onclick="addToCart(${p.id})" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 rounded-xl px-3 py-1.5 text-[11px] font-bold text-white transition shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                                    В корзину
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function addToCart(id) {
            triggerHaptic('light');
            const prod = products.find(p => p.id === id);
            if (!prod) return;
            
            const item = cart.find(i => i.id === id);
            if (item) {
