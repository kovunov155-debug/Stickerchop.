<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sticker Shop - Cyberpunk Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.3); border-radius: 9999px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-black font-sans antialiased">

    <!-- Шапка -->
    <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-cyan-500/20 p-4 flex justify-between items-center shadow-lg shadow-cyan-950/20">
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 via-purple-500 to-pink-500 flex items-center justify-center text-lg shadow-lg shadow-cyan-500/30">⚡</div>
            <div>
                <h1 class="text-base font-extrabold bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500 bg-clip-text text-transparent tracking-wide">CYBER STICKERS</h1>
                <p class="text-[11px] text-cyan-400/80 font-medium">Киберпанк коллекция · Telegram Shop</p>
            </div>
        </div>
        <button id="cart-btn" class="relative bg-slate-900 hover:bg-slate-800 border border-cyan-500/40 px-3.5 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2 shadow-md shadow-cyan-500/10 focus:outline-none focus:ring-1 focus:ring-cyan-400">
            <span class="text-lg">🛒</span>
            <span id="cart-count" class="absolute -top-2 -right-2 bg-pink-600 text-white text-xs px-2 py-0.5 rounded-full font-bold shadow-md shadow-pink-600/50">0</span>
        </button>
    </header>

    <!-- Основной контент -->
    <main class="p-4 max-w-md mx-auto flex-1 w-full pb-24 space-y-4">
        <!-- Поиск -->
        <div class="relative">
            <input id="search-input" type="text" placeholder="Поиск киберпанк стикеров..." class="w-full bg-slate-900/90 border border-cyan-500/30 rounded-xl px-4 py-3 pl-11 text-sm text-slate-100 placeholder-slate-500 outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition shadow-inner">
            <span class="absolute left-4 top-3.5 text-cyan-400">🔍</span>
        </div>

        <div class="flex justify-between items-center px-1">
            <h2 class="text-xs font-bold text-cyan-400 uppercase tracking-widest">Каталог паков</h2>
            <span class="text-xs text-pink-400 font-bold bg-pink-500/10 px-2 py-0.5 rounded-md border border-pink-500/20">45 - 80 ⭐</span>
        </div>

        <!-- Сетка товаров -->
        <div id="products-grid" class="grid grid-cols-2 gap-3.5"></div>
    </main>

    <!-- Корзина / Модальное окно -->
    <div id="cart-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden z-50 flex items-end sm:items-center justify-center">
        <div class="bg-slate-900 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 border-t sm:border border-cyan-500/30 shadow-2xl shadow-cyan-950 flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
                <div class="flex items-center gap-2">
                    <span class="text-lg">🛍️</span>
                    <h3 class="font-bold text-base text-white">Ваш заказ</h3>
                </div>
                <button id="close-cart" class="text-slate-400 hover:text-white transition text-lg px-2 py-1">✕</button>
            </div>
            
            <div id="cart-items" class="flex-1 overflow-y-auto space-y-2.5 mb-4 pr-1"></div>
            
            <div class="border-t border-slate-800 pt-3 mt-auto">
                <div class="flex justify-between items-center mb-3 text-sm font-semibold">
                    <span class="text-slate-400">К оплате на кошелек:</span>
                    <span id="cart-total" class="text-cyan-400 font-extrabold text-lg">0 ⭐</span>
                </div>
                <!-- Кнопка вызова Telegram оплату / отправки данных -->
                <button id="checkout-btn" class="w-full bg-gradient-to-r from-cyan-500 via-purple-600 to-pink-600 hover:opacity-95 py-3.5 rounded-xl font-bold text-white shadow-lg shadow-cyan-500/25 transition focus:outline-none focus:ring-2 focus:ring-cyan-400">
                    Оплатить через Telegram 🚀
                </button>
            </div>
        </div>
    </div>

    <!-- Скрипты -->
    <script>
        const tg = window.Telegram && window.Telegram.WebApp;
        try { tg.ready(); tg.expand(); } catch (e) {}

        function triggerHaptic(style = 'medium') { 
            if (tg && tg.HapticFeedback) { 
                try { tg.HapticFeedback.impactOccurred(style); } catch (e) {} 
            } 
        }

        // Расширенный список крутых стикеров в стиле киберпанк
        const products = [
            { id: 1, name: 'Cyber Neon Cat', ru: 'Кибер Неон Кот', price: 50, image: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=200&auto=format&fit=crop&q=80' },
            { id: 2, name: 'Matrix Hacker', ru: 'Матричный Хакер', price: 65, image: 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=200&auto=format&fit=crop&q=80' },
            { id: 3, name: 'Cyberpunk Skull', ru: 'Неоновый Череп', price: 60, image: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=200&auto=format&fit=crop&q=80' },
            { id: 4, name: 'Street Samurai', ru: 'Уличный Самурай', price: 80, image: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=200&auto=format&fit=crop&q=80' },
            { id: 5, name: 'Android Glitch', ru: 'Андроид Глитч', price: 55, image: 'https://images.unsplash.com/photo-1563089145-599997674d42?w=200&auto=format&fit=crop&q=80' },
            { id: 6, name: 'Neon City Pulse', ru: 'Пульс Неонового Города', price: 70, image: 'https://images.unsplash.com/photo-1518770660439-4636190af475?w=200&auto=format&fit=crop&q=80' },
            { id: 7, name: 'Cyber Punk Girl', ru: 'Кибер Девушка', price: 75, image: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=200&auto=format&fit=crop&q=80' },
            { id: 8, name: 'Future Biker', ru: 'Байер Будущего', price: 50, image: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=200&auto=format&fit=crop&q=80' },
            { id: 9, name: 'Holo Panther', ru: 'Голографическая Пантера', price: 65, image: 'https://images.unsplash.com/photo-1614064641938-3bbee52942c7?w=200&auto=format&fit=crop&q=80' },
            { id: 10, name: 'Quantum Core', ru: 'Квантовое Ядро', price: 45, image: 'https://images.unsplash.com/photo-1639762681485-074b7f938ba0?w=200&auto=format&fit=crop&q=80' }
        ];

        let cart = [];

        function renderProducts(items = products) {
            const grid = document.getElementById('products-grid');
            if (!grid) return;
            grid.innerHTML = '';
            
            items.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-slate-900/90 border border-cyan-500/20 rounded-2xl overflow-hidden shadow-lg shadow-cyan-950/20 hover:border-cyan-400/50 transition flex flex-col group">
                        <div class="w-full h-32 bg-slate-950 relative overflow-hidden flex items-center justify-center p-2">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent opacity-60 z-10"></div>
                            <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500 opacity-90">
                            <span class="absolute top-2 right-2 z-20 bg-slate-950/80 backdrop-blur border border-cyan-500/30 text-[10px] text-cyan-300 px-2 py-0.5 rounded-full font-bold">CYBER</span>
                        </div>
                        <div class="p-3 flex flex-col flex-1 justify-between">
                            <div>
                                <h3 class="font-bold text-xs text-slate-100 truncate">${p.name}</h3>
                                <p class="text-[11px] text-cyan-400/70 truncate">${p.ru}</p>
                            </div>
                            <div class="flex justify-between items-center mt-3 pt-2.5 border-t border-slate-800">
                                <span class="text-cyan-400 font-black text-xs">⭐ ${p.price}</span>
                                <button onclick="addToCart(${p.id})" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 rounded-xl px-3 py-1.5 text-[11px] font-bold text-black transition shadow-md shadow-cyan-500/20 focus:outline-none">
                                    В корзину
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function addToCart(id) {
            triggerHaptic('light');
            const prod = products.find(p => p.id === id);
            if (!prod) return;
            
            const item = cart.find(i => i.id === id);
            if (item) {
                item.quantity++;
            } else {
                cart.push({ ...prod, quantity: 1 });
            }
            updateCart();
            triggerHaptic('heavy');
        }

        function changeQty(id, delta) {
            triggerHaptic('light');
            const item = cart.find(i => i.id === id);
            if (!item) return;
            
            item.quantity += delta;
            if (item.quantity <= 0) {
                cart = cart.filter(i => i.id !== id);
            }
            updateCart();
        }

        function updateCart() {
            const count = cart.reduce((s, i) => s + i.quantity, 0);
            document.getElementById('cart-count').innerText = count;
            
            const cont = document.getElementById('cart-items');
            cont.innerHTML = cart.length === 0 ? '<p class="text-center text-slate-500 text-xs py-10">Ваша корзина пуста 🛒</p>' : '';
            
            cart.forEach(i => {
                cont.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-950/60 p-2.5 rounded-xl border border-cyan-500/20">
                        <div class="flex items-center gap-3">
                            <img src="${i.image}" class="w-11 h-11 rounded-lg object-cover border border-cyan-500/30">
                            <div>
                                <h4 class="text-xs font-bold text-white truncate max-w-[110px]">${i.name}</h4>
                                <p class="text-[11px] text-cyan-400 font-semibold">⭐ ${i.price} × ${i.quantity}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="changeQty(${i.id}, -1)" class="w-7 h-7 rounded-lg bg-slate-800 text-slate-300 hover:text-white font-bold flex items-center justify-center">-</button>
                            <span class="text-xs font-bold w-5 text-center">${i.quantity}</span>
                            <button onclick="changeQty(${i.id}, 1)" class="w-7 h-7 rounded-lg bg-cyan-500 text-black font-bold flex items-center justify-center">+</button>
                        </div>
                    </div>
                `;
            });

            const total = cart.reduce((s, i) => s + (i.price * i.quantity), 0);
            document.getElementById('cart-total').innerText = `${total} ⭐`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            
            const modal = document.getElementById('cart-modal');
            document.getElementById('cart-btn').addEventListener('click', () => { 
                triggerHaptic('light'); 
                modal.classList.remove('hidden'); 
            });
            document.getElementById('close-cart').addEventListener('click', () => { 
                triggerHaptic('light'); 
                modal.classList.add('hidden'); 
            });

            document.getElementById('search-input').addEventListener('input', (e) => {
                const q = e.target.value.toLowerCase();
                const filtered = products.filter(p => p.name.toLowerCase().includes(q) || p.ru.toLowerCase().includes(q));
                renderProducts(filtered);
            });

            // Настройка отправки данных на оплату / в Telegram-кошелек или бота
            document.getElementById('checkout-btn').addEventListener('click', () => {
                triggerHaptic('heavy');
                if (cart.length === 0) return alert('Добавьте товары в корзину!');
                
                const orderData = {
                    items: cart,
                    total: cart.reduce((s, i) => s + (i.price * i.quantity), 0),
                    timestamp: Date.now()
                };

                // Если приложение открыто внутри Telegram, отправляем данные боту для выставления счета/вывода на кошелек
                if (tg && typeof tg.sendData === 'function') {
                    try {
                        tg.sendData(JSON.stringify(orderData));
                    } catch (e) {
                        console.error(e);
                    }
                } else {
                    alert('Заказ сформирован! (Тестовый режим вне Telegram)');
                }
                
                cart = [];
                updateCart();
                modal.classList.add('hidden');
            });
        });
    </script>
</body>
</html>
